config:
  ul-indent:
    indent: 4
  ul-style:
    style: dash
  emphasis-style:
    style: asterisk
  no-duplicate-heading:
    siblings_only: true
  no-inline-html:
    allowed_elements:
      - a
      - p
      - details
      - summary
      - img
  no-trailing-spaces:
    br_spaces: 0
  line-length: false
  no-bare-urls: false
  link-fragments: false

ignores:
  - node_modules/**
  - build/**
  - .sdd/**
  - qa/evidence/**
  - qa/output/**
  - test/__fixtures__/**
  - src/assets/commands/templates/doc-agents/**
  - src/assets/commands/templates/doc-readme/**
  - src/assets/commands/templates/sdd-spec/task-structure-template.md
